name = "ss6-connect-handshake"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# KV binding SS6_EVIDENCE
# scripts/setup-kv.sh creates prod + preview namespaces and writes ids below.
# Until then the Worker still deploys; /health reports kv_bound: false.

# [[kv_namespaces]]
# binding = "SS6_EVIDENCE"
# id = "REPLACE_SS6_EVIDENCE_ID"
# preview_id = "REPLACE_SS6_EVIDENCE_PREVIEW_ID"

[vars]
HUB_NAME = "SS6-Connect Global Business Hub"
ALLOWED_ACTIONS = "ingest_evidence,request_candidate"
GITHUB_REPO = "GNAIAAAC-LLC/ss6-connect-handshake"
KV_BINDINGS = "SS6_EVIDENCE"

# Secrets:
#   npx wrangler secret put HANDSHAKE_HMAC
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN
